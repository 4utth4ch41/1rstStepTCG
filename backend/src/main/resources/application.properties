spring.application.name=1srtStepTCG
server.address=127.0.0.1
spring.profiles.default=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Product image uploads: at most 5 images, 5 MB each.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
app.product-images.directory=./data/product-images
